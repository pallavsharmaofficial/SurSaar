<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base href is replaced by `flutter build web --base-href /SurSaar/app/`
    in the Pages workflow so the app can live under a sub-path.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="SurSaar – learn guitar with an AI teacher that watches your hands, listens to your chords and keeps you on the beat. Free, in Hindi and English, camera and microphone stay on your device.">
  <meta name="theme-color" content="#0F172A">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://pallavsharmaofficial.github.io/SurSaar/app/">

  <!-- How the app looks when the link is shared -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SurSaar">
  <meta property="og:title" content="SurSaar · सुरसार – AI guitar teacher">
  <meta property="og:description" content="Real-time chord, strumming and finger-position coaching with your camera and microphone. Nothing is uploaded.">
  <meta property="og:image" content="https://pallavsharmaofficial.github.io/SurSaar/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://pallavsharmaofficial.github.io/SurSaar/app/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SurSaar · सुरसार – AI guitar teacher">
  <meta name="twitter:description" content="A guitar teacher that watches, listens and corrects you. Free, Hindi and English, nothing uploaded.">
  <meta name="twitter:image" content="https://pallavsharmaofficial.github.io/SurSaar/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SurSaar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SurSaar · सुरसार – AI Guitar Teacher</title>
  <link rel="manifest" href="manifest.json">

  <!-- Camera, hand tracking, microphone and metronome for the AI teacher. -->
  <script src="teacher/sursaar_teacher.js"></script>

  <style>
    html, body { height: 100%; margin: 0; background: #0F172A; }
    #sursaar-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #0F172A; color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .3s ease;
    }
    #sursaar-splash .logo { font-size: 42px; font-weight: 700; letter-spacing: .5px; }
    #sursaar-splash .logo span { color: #FF6B6B; }
    #sursaar-splash .bar { width: 160px; height: 4px; border-radius: 2px; background: #1E293B; overflow: hidden; }
    #sursaar-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #2D31FA;
      animation: sursaar-slide 1.1s infinite ease-in-out;
    }
    @keyframes sursaar-slide { 0% { transform: translateX(-100%);} 100% { transform: translateX(350%);} }
    flt-glass-pane, flutter-view { background: #0F172A; }
  </style>
</head>
<body>
  <div id="sursaar-splash" aria-hidden="true">
    <div class="logo">Sur<span>Saar</span></div>
    <div class="bar"></div>
    <div style="font-size:13px;opacity:.7">Loading your AI guitar teacher…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('sursaar-splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 320);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
