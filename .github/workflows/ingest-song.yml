name: Ingest requested song

# Runs when an issue gets the "song-request" label (the in-app "Request this
# song" button opens that issue pre-filled), or when triggered manually.
# Searches the allow-listed sources for the chord sheet, extracts chords /
# key / capo / strumming / structure, merges the song into
# content/sursaar_content.json, redeploys the site and comments on the issue.
#
# Security: untrusted text (issue title/body, inputs) is only ever passed
# through environment variables, never interpolated into scripts.

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      query:
        description: "Song title (optionally 'title - artist')"
        required: true
      sourceUrl:
        description: "Optional: exact chord-sheet URL to parse"
        required: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  # "opened" and "labeled" both fire for a new request; keep only one run.
  group: ingest-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ingest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'song-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve query
        id: q
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUT_QUERY: ${{ github.event.inputs.query }}
          INPUT_URL: ${{ github.event.inputs.sourceUrl }}
        run: node tools/ingest/cli.mjs resolve-request >> "$GITHUB_OUTPUT"

      - name: Ingest
        env:
          SURSAAR_SEARCH_PROVIDER: ${{ vars.SURSAAR_SEARCH_PROVIDER }}
          QUERY: ${{ steps.q.outputs.query }}
          ARTIST: ${{ steps.q.outputs.artist }}
          SHEET_URL: ${{ steps.q.outputs.url }}
        run: |
          node tools/ingest/cli.mjs ingest "$QUERY" \
            --artist "$ARTIST" \
            --url "$SHEET_URL" \
            --out content/sursaar_content.json \
            --report ingest-report.md

      - name: Commit content
        id: commit
        env:
          QUERY: ${{ steps.q.outputs.query }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if git diff --quiet -- content/sursaar_content.json; then
            echo "No content change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node tools/ingest/cli.mjs validate content/sursaar_content.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/sursaar_content.json
          git commit -m "content: ingest ${QUERY} (#${ISSUE_NUMBER:-manual})"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the
      # site is redeployed explicitly (workflow_dispatch is allowed).
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Comment on issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('ingest-report.md')
              ? fs.readFileSync('ingest-report.md', 'utf8')
              : 'Ingestion did not finish. A maintainer will check the workflow logs.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
