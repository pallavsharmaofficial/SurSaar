name: sursaar
description: SurSaar – an AI-powered real-time music school. Learn guitar with a teacher that watches and listens, on web and mobile.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^18.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.0
  flutter_svg: ^2.2.0
  uuid: ^4.5.1
  http: ^1.4.0
  json_annotation: ^4.10.0
  # Cross-platform persistence (works on web via localStorage).
  shared_preferences: ^2.5.3
  # Microphone PCM streaming on Android / iOS / desktop (web uses JS interop).
  record: ^7.0.0
  # Browser APIs for the web teacher (camera, hand tracking, Web Audio).
  web: ^1.1.1
  # Camera preview on Android / iOS.
  camera: ^0.12.0
  # Keep the screen awake during practice.
  wakelock_plus: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.0
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# The icon is a chord box, drawn by tools/branding/make_icon.py rather than
# exported from a design file. The web icons and favicon come from the same
# script, because a plain downscale of the 1024 pixel icon loses the small
# optical size, so this tool is told to leave the web alone.
flutter_launcher_icons:
  image_path: assets/branding/icon-1024.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#2D31FA"
  adaptive_icon_foreground: assets/branding/icon-foreground.png
  adaptive_icon_monochrome: assets/branding/icon-monochrome.png

# The app is dark only (ThemeMode.dark in lib/core/app.dart), so the launch
# screen is the same navy in both modes; a white flash before a dark app is
# what this is here to prevent.
flutter_native_splash:
  color: "#0F172A"
  color_dark: "#0F172A"
  image: assets/branding/splash-light.png
  image_dark: assets/branding/splash-dark.png
  android_12:
    image: assets/branding/splash-light.png
    icon_background_color: "#0F172A"
    image_dark: assets/branding/splash-dark.png
    icon_background_color_dark: "#0F172A"
  web: false

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
