name: sursaar
description: SurSaar – an AI-powered real-time music school. Learn guitar with a teacher that watches and listens, on web and mobile.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^18.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  flutter_animate: ^4.5.2
  google_fonts: ^8.0.0
  flutter_svg: ^2.2.0
  uuid: ^4.5.1
  http: ^1.4.0
  json_annotation: ^4.10.0
  # Cross-platform persistence (works on web via localStorage).
  shared_preferences: ^2.5.3
  # Microphone PCM streaming on Android / iOS / desktop (web uses JS interop).
  record: ^7.0.0
  # Browser APIs for the web teacher (camera, hand tracking, Web Audio).
  web: ^1.1.1
  # Camera preview on Android / iOS.
  camera: ^0.12.0
  # Keep the screen awake during practice.
  wakelock_plus: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/
